<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Listado de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>


    <div class="container mt-4">

        <div th:fragment="alertas">
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </div>
        <h1>Lista de Productos <span th:text="${productos.getNumber()}"></span></h1>

        <a th:href="@{/producto/nuevo}" class="btn btn-primary mb-3">
            Crear Producto
        </a>

        <P>Id Pedido: </P>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Pedido</th>
                    <th>Cliente</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="producto : ${productos.getContent()}">
        
                    <td th:text="${producto.nombre}"></td>
                    <td th:text="${producto.descripcion}"></td>
                    <td th:text="${producto.precio}"></td>
                    <td th:text="'#' + ${producto.pedido.id}"></td>
                    <td th:text="${producto.pedido.cliente.nombre + ' ' + producto.pedido.cliente.apellidos}"></td>

                    <td>
                        <a th:href="@{/producto/editar/{id}(id=${producto.id})}" class="btn btn-secondary btn-sm">
                            Modificar
                        </a>
                    </td>

                    <td>
                        <form th:action="@{/producto/{id}/eliminar(id=${producto.id})}" th:method="delete">

                            <input type="hidden" name="_method" value="delete">

                            <button type="submit" class="btn btn-danger btn-sm">
                                Eliminar
                            </button>

                        </form>
                    </td>

                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
