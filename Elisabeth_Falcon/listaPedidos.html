<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Listado de Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>


    <div class="container mt-4">

        <div th:fragment="alertas">
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </div>
        <h1 >Lista de Pedidos <span th:text="${pedidos.getNumber()}"></span></h1>
        
        <a th:href="@{/pedido/nuevo}" class="btn btn-primary mb-3">
            Crear Pedido
        </a>
        <a th:href="@{/producto/lista}" class="btn btn-outline-secondary mb-3">
            Ver Productos
        </a>
        
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Fecha</th>
                    <th>Nombre cliente</th>
                    <th>Estado Pedido</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="pedido : ${pedidos.getContent()}">

                    <td th:text="${pedido.id}"></td>
                    <td th:text="${pedido.Fecha}"></td>
                    <td th:text="${cliente.nombre}"></td>
                    <td th:text="${pedido.Estado}"></td>

                    <td>
                        <a th:href="@{/pedido/lista/{id}(id=${pedido.id})}" class="btn btn-secondary btn-sm">
                            Ver paquete
                        </a>
                    </td>

                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
