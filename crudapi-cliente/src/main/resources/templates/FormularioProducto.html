<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
    Ubicación: src/main/resources/templates/FormularioProducto.html
    Formulario de alta de producto: hace POST a /producto/insertar
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Nuevo producto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4" style="max-width: 600px;">

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>

        <h1>Nuevo producto</h1>

        <div th:if="${clientes.isEmpty()}" class="alert alert-warning">
            No hay clientes todavía. <a th:href="@{/cliente/nuevo}">Crea un cliente</a> antes de añadir productos.
        </div>

        <form th:object="${producto}" th:action="@{/producto/insertar}" method="post">

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" th:field="*{nombre}" required>
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" rows="3" th:field="*{descripcion}"></textarea>
            </div>

            <div class="mb-3">
                <label for="precio" class="form-label">Precio (€)</label>
                <input type="number" step="0.01" min="0" class="form-control" th:field="*{precio}" required>
            </div>

            <!-- No usamos th:field aqui: el select envia solo el id del cliente (clienteId)
                 y el controlador carga la entity con repoCli.findById -->
            <div class="mb-3">
                <label for="clienteId" class="form-label">Cliente</label>
                <select class="form-select" id="clienteId" name="clienteId" required>
                    <option value="" disabled th:selected="${producto.cliente == null}">Selecciona un cliente</option>
                    <option th:each="c : ${clientes}" th:value="${c.id}"
                        th:text="${c.nombre + ' ' + c.apellidos + ' (' + c.email + ')'}"
                        th:selected="${producto.cliente != null and producto.cliente.id == c.id}">
                    </option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/producto/lista}" class="btn btn-outline-secondary">Cancelar</a>

        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
