<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Ubicación: src/main/resources/templates/logs/lista.html -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div th:replace="~{fragments/menu :: navbar}"></div>

    <div class="container mt-4">

        <div th:replace="~{fragments/menu :: alertas}"></div>

        <h1>Registro de actividad</h1>

        <p th:if="${logs.isEmpty()}" class="text-muted">Todavía no se ha registrado ninguna acción.</p>

        <table class="table table-striped" th:unless="${logs.isEmpty()}">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Acción</th>
                    <th>Entidad</th>
                    <th>Descripción</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="log : ${logs.content}">
                    <td th:text="${#temporals.format(log.fecha, 'dd/MM/yyyy HH:mm:ss')}"></td>
                    <td>
                        <span class="badge" th:text="${log.accion}"
                            th:classappend="${log.accion == 'CREAR'} ? 'text-bg-success' : (${log.accion == 'ELIMINAR'} ? 'text-bg-danger' : 'text-bg-secondary')"></span>
                    </td>
                    <td th:text="${log.entidad}"></td>
                    <td th:text="${log.descripcion}"></td>
                </tr>
            </tbody>
        </table>

        <nav th:if="${logs.totalPages > 1}">
            <ul class="pagination">
                <li class="page-item" th:classappend="${logs.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/logs(page=${logs.number - 1}, size=${size})}">Anterior</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, logs.totalPages - 1)}"
                    th:classappend="${i == logs.number} ? 'active'">
                    <a class="page-link" th:href="@{/logs(page=${i}, size=${size})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${logs.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/logs(page=${logs.number + 1}, size=${size})}">Siguiente</a>
                </li>
            </ul>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
