<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estadísticas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div th:replace="~{fragments/menu :: navbar}"></div>

    <div class="container mt-4">

        <div th:replace="~{fragments/menu :: alertas}"></div>

        <h1>Estadísticas</h1>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card text-center">
                    <div class="card-body">
                        <h2 th:text="${totalAgrupaciones}"></h2>
                        <p class="mb-0">Agrupaciones</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card text-center">
                    <div class="card-body">
                        <h2 th:text="${totalAutores}"></h2>
                        <p class="mb-0">Autores</p>
                    </div>
                </div>
            </div>
        </div>

        <h2>Agrupaciones por modalidad</h2>
        <p th:if="${porModalidad.isEmpty()}" class="text-muted">Todavía no hay agrupaciones con modalidad.</p>
        <table class="table" th:unless="${porModalidad.isEmpty()}">
            <tbody>
                <tr th:each="fila : ${porModalidad}">
                    <td style="width: 20%;" th:text="${fila.key}"></td>
                    <td>
                        <div class="progress">
                            <div class="progress-bar" th:style="'width: ' + ${fila.value * 100 / maximo} + '%'"
                                th:text="${fila.value}"></div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <h2 class="mt-4">Las 5 agrupaciones más antiguas</h2>
        <p th:if="${masAntiguas.isEmpty()}" class="text-muted">Todavía no hay agrupaciones.</p>
        <ol class="list-group list-group-numbered" th:unless="${masAntiguas.isEmpty()}">
            <li class="list-group-item d-flex justify-content-between" th:each="agrupacion : ${masAntiguas}">
                <a th:href="@{/agrupacion/detalle/{id}(id=${agrupacion.id})}" th:text="${agrupacion.nombre}"></a>
                <span class="badge text-bg-secondary" th:text="${agrupacion.anioFundacion} ?: 'sin año'"></span>
            </li>
        </ol>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
