<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Ubicación: src/main/resources/templates/fragments/menu.html
     Tiene 3 fragmentos que se incluyen en las demás páginas:
       <div th:replace="~{fragments/menu :: navbar}"></div>        -> menú superior
       <div th:replace="~{fragments/menu :: alertas}"></div>       -> avisos verde/rojo
       <div th:replace="~{fragments/menu :: modalEliminar}"></div> -> modal de confirmar borrado -->

<body>

    <!-- ============ MENÚ SUPERIOR ============ -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/agrupacion}">🎭 Gadex - Todo Carnaval</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/agrupacion}">Agrupaciones</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/autor}">Autores</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/busqueda}">Búsqueda avanzada</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/estadisticas}">Estadísticas</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/logs}">Logs</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ============ AVISOS ============ -->
    <div th:fragment="alertas">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
    </div>

    <!-- ============ MODAL DE CONFIRMACIÓN DE BORRADO ============
         Cada botón "Eliminar" le pasa data-url (a dónde ir) y data-nombre (qué se borra) -->
    <div th:fragment="modalEliminar">
        <div class="modal fade" id="modalEliminar" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Confirmar eliminación</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        ¿Seguro que quieres eliminar <strong id="modalNombre"></strong>?
                        Esta acción no se puede deshacer.
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <a id="modalEnlace" href="#" class="btn btn-danger">Eliminar</a>
                    </div>
                </div>
            </div>
        </div>

        <script>
            document.getElementById('modalEliminar').addEventListener('show.bs.modal', function (event) {
                const boton = event.relatedTarget;
                document.getElementById('modalNombre').textContent = boton.getAttribute('data-nombre');
                document.getElementById('modalEnlace').setAttribute('href', boton.getAttribute('data-url'));
            });
        </script>
    </div>

</body>

</html>
