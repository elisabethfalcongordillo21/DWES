<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar autor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div th:replace="~{fragments/menu :: navbar}"></div>

    <div class="container mt-4" style="max-width: 700px;">

        <div th:replace="~{fragments/menu :: alertas}"></div>

        <h1>Editar autor</h1>

        <form th:object="${autor}" th:action="@{/autor/modificar}" method="post">

            <input type="hidden" name="agrupacionId" th:if="${agrupacionId != null}" th:value="${agrupacionId}">

            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" th:field="*{nombre}" required>
            </div>

            <div class="mb-3">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input type="text" class="form-control" th:field="*{apellidos}" required>
            </div>

            <div class="mb-3">
                <label for="apodo" class="form-label">Apodo</label>
                <input type="text" class="form-control" th:field="*{apodo}">
            </div>

            <div class="mb-3">
                <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                <input type="date" class="form-control" th:field="*{fechaNacimiento}">
            </div>

            <div class="mb-3">
                <label for="localidad" class="form-label">Localidad</label>
                <input type="text" class="form-control" th:field="*{localidad}">
            </div>

            <div class="mb-3">
                <label for="biografia" class="form-label">Biografía</label>
                <textarea class="form-control" rows="5" maxlength="3000" th:field="*{biografia}"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="${agrupacionId != null} ? @{/agrupacion/detalle/{id}(id=${agrupacionId})} : @{/autor}"
                class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
