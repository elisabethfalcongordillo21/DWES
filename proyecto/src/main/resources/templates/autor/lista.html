<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Autores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div th:replace="~{fragments/menu :: navbar}"></div>

    <div class="container mt-4">

        <div th:replace="~{fragments/menu :: alertas}"></div>

        <h1>Autores</h1>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <a th:href="@{/autor/nuevo}" class="btn btn-primary">Nuevo autor</a>

            <div>
                <span class="me-2">Por página:</span>
                <a th:each="n : ${#numbers.sequence(5, 20, 5)}" th:href="@{/autor(page=0, size=${n})}"
                    th:text="${n}" class="btn btn-sm me-1"
                    th:classappend="${n == size} ? 'btn-secondary' : 'btn-outline-secondary'"></a>
            </div>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Apodo</th>
                    <th>Localidad</th>
                    <th>Nacimiento</th>
                    <th>Agrupaciones</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="autor : ${autores.content}">
                    <td th:text="${autor.nombre}"></td>
                    <td th:text="${autor.apellidos}"></td>
                    <td th:text="${autor.apodo}"></td>
                    <td th:text="${autor.localidad}"></td>
                    <td th:text="${autor.fechaNacimiento}"></td>
                    <td>
                        <a th:each="agr : ${autor.agrupaciones}" th:href="@{/agrupacion/detalle/{id}(id=${agr.id})}"
                            th:text="${agr.nombre}" class="badge text-bg-secondary text-decoration-none me-1"></a>
                    </td>
                    <td>
                        <a th:href="@{/autor/editar/{id}(id=${autor.id})}"
                            class="btn btn-secondary btn-sm">Modificar</a>

                        <button type="button" class="btn btn-danger btn-sm" data-bs-toggle="modal"
                            data-bs-target="#modalEliminar"
                            th:attr="data-url=@{/autor/eliminar/{id}(id=${autor.id})},data-nombre=${autor.nombre + ' ' + autor.apellidos}">
                            Eliminar
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

        <nav th:if="${autores.totalPages > 1}">
            <ul class="pagination">
                <li class="page-item" th:classappend="${autores.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/autor(page=${autores.number - 1}, size=${size})}">Anterior</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, autores.totalPages - 1)}"
                    th:classappend="${i == autores.number} ? 'active'">
                    <a class="page-link" th:href="@{/autor(page=${i}, size=${size})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${autores.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/autor(page=${autores.number + 1}, size=${size})}">Siguiente</a>
                </li>
            </ul>
        </nav>
    </div>

    <div th:replace="~{fragments/menu :: modalEliminar}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
