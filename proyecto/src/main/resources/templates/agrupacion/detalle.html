<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${agrupacion.nombre}">Detalle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div th:replace="~{fragments/menu :: navbar}"></div>

    <div class="container mt-4">

        <div th:replace="~{fragments/menu :: alertas}"></div>

        <div class="card mb-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-8">
                        <h1 th:text="${agrupacion.nombre}"></h1>
                        <dl class="row">
                            <dt class="col-sm-3">Modalidad</dt>
                            <dd class="col-sm-9" th:text="${agrupacion.modalidad?.nombre} ?: '-'"></dd>

                            <dt class="col-sm-3">Localidad</dt>
                            <dd class="col-sm-9" th:text="${agrupacion.localidad} ?: '-'"></dd>

                            <dt class="col-sm-3">Año de fundación</dt>
                            <dd class="col-sm-9" th:text="${agrupacion.anioFundacion} ?: '-'"></dd>

                            <dt class="col-sm-3">Web</dt>
                            <dd class="col-sm-9">
                                <a th:if="${agrupacion.web != null and !agrupacion.web.isEmpty()}"
                                    th:href="${agrupacion.web}" th:text="${agrupacion.web}" target="_blank"></a>
                                <span th:unless="${agrupacion.web != null and !agrupacion.web.isEmpty()}">-</span>
                            </dd>

                            <dt class="col-sm-3">Descripción</dt>
                            <dd class="col-sm-9" th:text="${agrupacion.descripcion} ?: '-'"></dd>
                        </dl>
                    </div>
                    <div class="col-md-4">
                        <img th:if="${agrupacion.fotoUrl != null and !agrupacion.fotoUrl.isEmpty()}"
                            th:src="${agrupacion.fotoUrl}" class="img-fluid rounded" alt="Foto de la agrupación">
                    </div>
                </div>

                <a th:href="@{/agrupacion/editar/{id}(id=${agrupacion.id})}" class="btn btn-secondary">Modificar</a>
                <a th:href="@{/agrupacion}" class="btn btn-outline-secondary">Volver al listado</a>
            </div>
        </div>

        <h2>Autores</h2>

        <div class="d-flex flex-wrap gap-2 mb-3">
            <a th:href="@{/autor/nuevo(agrupacionId=${agrupacion.id})}" class="btn btn-primary">
                Añadir autor nuevo
            </a>

            <form th:if="${!disponibles.isEmpty()}" th:action="@{/autor/asociar}" method="post"
                class="d-flex gap-2">
                <input type="hidden" name="agrupacionId" th:value="${agrupacion.id}">
                <select name="autorId" class="form-select" required>
                    <option value="">-- Autor existente --</option>
                    <option th:each="a : ${disponibles}" th:value="${a.id}"
                        th:text="${a.nombre} + ' ' + ${a.apellidos}"></option>
                </select>
                <button type="submit" class="btn btn-success">Asociar</button>
            </form>
        </div>

        <p th:if="${autores.isEmpty()}" class="text-muted">Esta agrupación todavía no tiene autores.</p>

        <table class="table table-striped" th:unless="${autores.isEmpty()}">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellidos</th>
                    <th>Apodo</th>
                    <th>Localidad</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="autor : ${autores}">
                    <td th:text="${autor.nombre}"></td>
                    <td th:text="${autor.apellidos}"></td>
                    <td th:text="${autor.apodo}"></td>
                    <td th:text="${autor.localidad}"></td>
                    <td>
                        <a th:href="@{/autor/editar/{id}(id=${autor.id}, agrupacionId=${agrupacion.id})}"
                            class="btn btn-secondary btn-sm">Modificar</a>

                        <a th:href="@{/autor/desasociar(autorId=${autor.id}, agrupacionId=${agrupacion.id})}"
                            class="btn btn-warning btn-sm">Desasociar</a>

                        <button type="button" class="btn btn-danger btn-sm" data-bs-toggle="modal"
                            data-bs-target="#modalEliminar"
                            th:data-url="@{/autor/eliminar/{id}(id=${autor.id},agrupacionId=${agrupacion.id})}"
                            th:data-nombre="${autor.nombre + ' ' + autor.apellidos}">
                            Eliminar
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/menu :: modalEliminar}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
