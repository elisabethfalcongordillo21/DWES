<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar agrupación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div th:replace="~{fragments/menu :: navbar}"></div>

    <div class="container mt-4" style="max-width: 700px;">

        <div th:replace="~{fragments/menu :: alertas}"></div>

        <h1>Editar agrupación</h1>

        <form th:object="${agrupacion}" th:action="@{/agrupacion/modificar}" method="post">

            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" th:field="*{nombre}" required>
            </div>

            <div class="mb-3">
                <label for="modalidad" class="form-label">Modalidad</label>
                <select id="modalidad" name="modalidad.id" class="form-select">
                    <option value="">-- Sin modalidad --</option>
                    <option th:each="m : ${modalidades}" th:value="${m.id}" th:text="${m.nombre}"
                        th:selected="${agrupacion.modalidad != null and agrupacion.modalidad.id == m.id}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" rows="4" maxlength="2000" th:field="*{descripcion}"></textarea>
            </div>

            <div class="mb-3">
                <label for="localidad" class="form-label">Localidad</label>
                <input type="text" class="form-control" th:field="*{localidad}">
            </div>

            <div class="mb-3">
                <label for="anioFundacion" class="form-label">Año de fundación</label>
                <input type="number" class="form-control" th:field="*{anioFundacion}" min="1800" max="2100">
            </div>

            <div class="mb-3">
                <label for="fotoUrl" class="form-label">URL de la foto</label>
                <input type="text" class="form-control" th:field="*{fotoUrl}">
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/agrupacion}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
